name: Verify local discovery
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m pytest backend/tests -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: PYTHONPATH=backend python -m navylink.evaluate
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: PYTHONPATH=backend python -m uvicorn navylink.main:app --host 127.0.0.1 --port 8000 > /tmp/navylink-api.log 2>&1 &
      - run: python -c "import time,urllib.request; time.sleep(2); urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      - run: npm --prefix frontend test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-and-browser-evidence
          path: |
            docs/evaluation.json
            docs/*.png
            frontend/test-results
